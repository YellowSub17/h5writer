[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "h5writer"
description = "Tool for writing HDF5 files"
authors = [
    {name = "Max F. Hantke", email = "maxhantke@gmail.com"},
    {name = "Benedikt Daurer"},
    {name = "Filipe R. N. C. Maia"},
    {name = "Jamie van der Sanden"}
]
license = {text = "MIT License"}
requires-python = ">=3.6"
dynamic = ["version"]

dependencies = [
    "h5py>=2.2"
]

# FIX: Classifiers must be a flat list/array, not a table
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
mpi = ["mpi4py>=1.3.1"]

[project.urls]
Homepage = "https://github.com/mhantke/h5writer"

[tool.setuptools]
packages = ["h5writer"]

[tool.setuptools.dynamic]
# Points to the __version__ variable inside h5writer/_version.py
version = {attr = "h5writer._version.__version__"}
